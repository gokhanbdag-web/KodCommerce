name: PHP checks
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: kodcommerce_test
          MYSQL_USER: kodcommerce
          MYSQL_PASSWORD: testing123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: find app public views -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate Page Builder JavaScript syntax
        run: node --check public/assets/js/page-builder.js
      - name: Smoke test installer, AJAX login and storefront
        run: bash tests/smoke.sh
      - name: Verify gettext catalog coverage
        run: python3 tests/check_gettext.py
      - name: Compile translation catalogs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gettext
          find locales -name '*.po' -print0 | while IFS= read -r -d '' f; do msgfmt --check "$f" -o "${f%.po}.mo"; done
      - name: Verify no uncommitted compiled files
        run: git status --short
